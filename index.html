<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tunaerl Oyun Önerme</title>
<style>
:root{--bg:#080910;--panel:#111321;--panel2:#171a2b;--text:#f5f6ff;--muted:#969bb5;--accent:#8b5cf6;--accent2:#22d3ee;--line:#272b42}
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 50% 0%,#20204a 0%,#0b0c17 38%,var(--bg) 72%);font-family:Inter,Segoe UI,Arial,sans-serif;color:var(--text);padding:32px 18px}
.wrap{max-width:940px;margin:0 auto}.hero{text-align:center;padding:45px 0 32px}.logo{display:inline-flex;align-items:center;justify-content:center;width:58px;height:58px;border-radius:18px;background:linear-gradient(135deg,var(--accent),var(--accent2));font-size:27px;box-shadow:0 0 40px #8b5cf644;margin-bottom:18px}
h1{font-size:clamp(30px,5vw,48px);letter-spacing:-1.5px;margin:0 0 12px;font-weight:850}.gradient{background:linear-gradient(90deg,#c4b5fd,#67e8f9);-webkit-background-clip:text;background-clip:text;color:transparent}
.sub{color:var(--muted);font-size:15px;margin:0 auto;max-width:540px;line-height:1.6}
.panel{background:#111321eF;border:1px solid var(--line);border-radius:22px;padding:24px;box-shadow:0 22px 70px #0005;margin-bottom:20px}
.panel h2{font-size:18px;margin:0 0 18px}.formgrid{display:grid;grid-template-columns:1fr 1fr;gap:13px}.field{display:flex;flex-direction:column;gap:8px}.field.full{grid-column:1/-1}label{font-size:12px;color:#b7bbd1;font-weight:700;letter-spacing:.4px;text-transform:uppercase}
input{width:100%;background:#090b15;color:var(--text);border:1px solid #30344d;border-radius:12px;padding:14px 15px;font-size:15px;outline:none;transition:.2s}input:focus{border-color:var(--accent);box-shadow:0 0 0 3px #8b5cf622}
button{border:0;border-radius:12px;padding:14px 18px;font-weight:800;font-size:14px;cursor:pointer;color:#080910;background:linear-gradient(100deg,#a78bfa,#67e8f9);transition:transform .15s,filter .15s}button:hover{filter:brightness(1.08);transform:translateY(-1px)}button.secondary{background:#202338;color:#dfe2ff;border:1px solid #353a55}
.suggestions{display:none;background:#0b0d18;border:1px solid #30344d;border-radius:12px;overflow:hidden;margin-top:-3px}.suggestions button{display:block;width:100%;text-align:left;background:transparent;color:#e9eaff;border-radius:0;padding:12px 14px;font-weight:500}.suggestions button:hover{background:#1d2036;transform:none}
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin-bottom:20px}.stat{background:#111321;border:1px solid var(--line);border-radius:17px;padding:17px}.stat small{display:block;color:var(--muted);font-size:12px;margin-bottom:8px}.stat strong{font-size:25px;letter-spacing:-.5px}
.toolbar{display:flex;gap:12px;align-items:center;justify-content:space-between;margin-bottom:16px}.toolbar h2{margin:0}.toolbar input{max-width:280px;padding:11px 13px}
.game-list{display:grid;gap:12px}.game{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;border:1px solid var(--line);background:linear-gradient(110deg,#171a2b,#10121f)}.rank{width:42px;height:42px;display:grid;place-items:center;border-radius:13px;background:#24213f;color:#c4b5fd;font-weight:900;flex-shrink:0}.gameinfo{flex:1;min-width:0}.gametitle{font-weight:800;font-size:16px;overflow-wrap:anywhere}.detail{font-size:12px;color:var(--muted);margin-top:5px;line-height:1.5}.count{font-weight:900;font-size:22px;text-align:right;white-space:nowrap}.count small{display:block;font-size:10px;color:var(--muted);font-weight:600;text-transform:uppercase;letter-spacing:.7px}
.empty{text-align:center;color:var(--muted);padding:30px 15px;border:1px dashed #343850;border-radius:15px;line-height:1.7}.footer{text-align:center;color:#656b86;font-size:12px;padding:18px 0 4px}.notice{color:#a5f3fc;font-size:13px;min-height:18px;margin-top:12px}
@media(max-width:620px){body{padding:16px 12px}.hero{padding:28px 0 24px}.panel{padding:17px}.formgrid{grid-template-columns:1fr}.field.full{grid-column:auto}.stats{gap:8px}.stat{padding:12px}.stat strong{font-size:21px}.toolbar{align-items:stretch;flex-direction:column}.toolbar input{max-width:none}.game{gap:10px;padding:12px}.rank{width:35px;height:35px}.count{font-size:19px}}
</style>
</head>
<body>
<div class="wrap">
  <header class="hero">
    <div class="logo">🎮</div>
    <h1><span class="gradient">TUNAERL</span><br>OYUN ÖNERME</h1>
    <p class="sub">Steam mağazasında oyun ara, kimin önerdiğini kaydet ve en çok önerilen oyunları gör.</p>
  </header>
  <section class="panel">
    <h2>＋ Yeni oyun önerisi</h2>
    <form id="suggestForm" class="formgrid">
      <div class="field full">
        <label for="gameInput">Steam oyunlarında ara veya isim yaz</label>
        <input id="gameInput" autocomplete="off" placeholder="Örn. Minecraft, GTA V, R.E.P.O..." required>
        <div class="suggestions" id="suggestions"></div>
      </div>
      <div class="field">
        <label for="personInput">Kim öneriyor?</label>
        <input id="personInput" maxlength="40" placeholder="İsmini yaz" required>
      </div>
      <div class="field">
        <label for="noteInput">Not (isteğe bağlı)</label>
        <input id="noteInput" maxlength="100" placeholder="Neden öneriyorsun?">
      </div>
      <div class="field full">
        <button type="submit">Öneriyi kaydet ↗</button>
      </div>
    </form>
    <div class="notice" id="notice" role="status"></div>
  </section>
  <div class="stats">
    <div class="stat"><small>Toplam öneri</small><strong id="totalCount">0</strong></div>
    <div class="stat"><small>Farklı oyun</small><strong id="gameCount">0</strong></div>
    <div class="stat"><small>Öneren kişi</small><strong id="personCount">0</strong></div>
  </div>
  <section class="panel">
    <div class="toolbar">
      <h2>🔥 Oyun önerileri</h2>
      <input id="filterInput" placeholder="Listede oyun ara...">
    </div>
    <div class="game-list" id="gameList"></div>
  </section>
  <div class="footer">TUNAERL OYUN ÖNERME · Steam mağazasında canlı arama · Öneriler bu tarayıcıda saklanır.</div>
</div>
<script type="module">
  
import { initializeApp } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-app.js";
import { getAuth, signInAnonymously } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-auth.js";
import { getDatabase, ref, push, set, onValue } from "https://www.gstatic.com/firebasejs/10.14.1/firebase-database.js";

const firebaseConfig = {
  apiKey: "AIzaSyAYTLr_9O7buUPhXKqlrQfarsxpmuZQdiE",
  authDomain: "tunaerl-oyun-onerme.firebaseapp.com",
  databaseURL: "https://tunaerl-oyun-onerme-default-rtdb.firebaseio.com",
  projectId: "tunaerl-oyun-onerme",
  storageBucket: "tunaerl-oyun-onerme.firebasestorage.app",
  messagingSenderId: "301064865575",
  appId: "1:301064865575:web:573d12462c457697e84b02",
  measurementId: "G-QJ92DT2EYS"
};

const app = initializeApp(firebaseConfig);
const auth = getAuth(app);
const db = getDatabase(app);
let currentUser = null;

signInAnonymously(auth)
  .then(({ user }) => {
    currentUser = user;
    console.log("Firebase bağlantısı hazır!");
  })
  .catch(error => {
    console.error("Firebase bağlantı hatası:", error);
  });

const starterGames = [
  "Minecraft","Grand Theft Auto V","R.E.P.O.","Lethal Company","Euro Truck Simulator 2",
  "Content Warning","Phasmophobia","Terraria","Stardew Valley","The Sims 4",
  "Schedule I","Balatro","Hades","Risk of Rain 2","Project Zomboid",
  "Football Manager","BeamNG.drive","PowerWash Simulator","House Flipper","Among Us"
];
const $ = id => document.getElementById(id);
let entries = [];
let entries = [];
let chosen = "";
function save(){}
let searchTimer=null, searchRequest=0;
async function showSuggestions(){
  const raw=$("gameInput").value.trim();
  const q=raw.toLocaleLowerCase("tr");
  const box=$("suggestions");
  if(!q){box.style.display="none";return;}
  const existing=[...new Set([...starterGames,...entries.map(x=>x.game)])];
  const local=existing.filter(g=>g.toLocaleLowerCase("tr").includes(q)).slice(0,5);
  box.innerHTML="";
  const req=++searchRequest;
  const addChoice=(name, id=null)=>{
    const b=document.createElement("button");b.type="button";b.textContent=name;
    b.onclick=()=>{ $("gameInput").value=name; chosen=name; box.style.display="none"; };
    if(id)b.title="Steam App ID: "+id;
    box.appendChild(b);
  };
  local.forEach(g=>addChoice(g));
  const custom=document.createElement("button");custom.type="button";custom.textContent='＋ "'+raw+'" oyununu kullan';
  custom.onclick=()=>{chosen=raw;$("gameInput").value=raw;box.style.display="none";};
  box.appendChild(custom);
  const status=document.createElement("button");status.type="button";status.disabled=true;status.textContent="Steam mağazasında aranıyor…";status.style.color="#969bb5";status.style.cursor="default";status.style.background="transparent";box.appendChild(status);
  box.style.display="block";
  try{
    const target='https://store.steampowered.com/api/storesearch/?term='+encodeURIComponent(raw)+'&l=turkish&cc=tr';
    const response=await fetch('https://proxy.cors.dev/'+target,{credentials:'omit'});
    if(!response.ok)throw new Error('Steam araması şu anda kullanılamıyor');
    const data=await response.json();
    if(req!==searchRequest)return;
    box.innerHTML="";
    const results=(data.items||[]).filter(x=>x.type==='app').slice(0,10);
    const seen=new Set();
    results.forEach(item=>{if(!seen.has(item.name.toLocaleLowerCase('tr'))){seen.add(item.name.toLocaleLowerCase('tr'));addChoice(item.name,item.id);}});
    if(!seen.has(q)){
      const b=document.createElement("button");b.type="button";b.textContent='＋ "'+raw+'" ismini yine de kullan';
      b.onclick=()=>{chosen=raw;$("gameInput").value=raw;box.style.display="none";};box.appendChild(b);
    }
    if(!results.length){const no=document.createElement("button");no.type="button";no.disabled=true;no.textContent="Steam'de sonuç bulunamadı; ismi elle ekleyebilirsin.";no.style.color="#969bb5";box.appendChild(no);}
  }catch(err){
    if(req!==searchRequest)return;
    const msg=document.createElement("button");msg.type="button";msg.disabled=true;msg.textContent="Canlı Steam araması açılamadı; oyun adını elle ekleyebilirsin.";msg.style.color="#969bb5";msg.style.background="transparent";box.appendChild(msg);
  }
}
function render(){
  const groups=new Map();
  entries.forEach(e=>{const key=e.game.toLocaleLowerCase("tr");if(!groups.has(key))groups.set(key,{game:e.game,entries:[]});groups.get(key).entries.push(e);});
  const all=[...groups.values()].sort((a,b)=>b.entries.length-a.entries.length || a.game.localeCompare(b.game,"tr"));
  const people=new Set(entries.map(e=>e.person.trim().toLocaleLowerCase("tr")));
  $("totalCount").textContent=entries.length;
  $("gameCount").textContent=groups.size;
  $("personCount").textContent=people.size;
  const q=$("filterInput").value.trim().toLocaleLowerCase("tr");
  const shown=all.filter(g=>g.game.toLocaleLowerCase("tr").includes(q)||g.entries.some(e=>e.person.toLocaleLowerCase("tr").includes(q)));
  const list=$("gameList");list.innerHTML="";
  if(!shown.length){list.innerHTML='<div class="empty">Henüz öneri yok veya aramana uygun sonuç bulunamadı.<br>İlk öneriyi yukarıdan ekleyebilirsin.</div>';return;}
  shown.forEach((g,i)=>{
    const card=document.createElement("div");card.className="game";
    const rank=document.createElement("div");rank.className="rank";rank.textContent="#"+(all.indexOf(g)+1);
    const info=document.createElement("div");info.className="gameinfo";
    const title=document.createElement("div");title.className="gametitle";title.textContent=g.game;
    const detail=document.createElement("div");detail.className="detail";
    detail.textContent="Önerenler: "+g.entries.map(e=>e.person+(e.note?" — "+e.note:"")).join(" · ");
    const count=document.createElement("div");count.className="count";count.innerHTML='<span>'+g.entries.length+'</span><small>öneri</small>';
    info.append(title,detail);card.append(rank,info,count);list.appendChild(card);
  });
}
$("gameInput").addEventListener("input",()=>{chosen="";clearTimeout(searchTimer);searchTimer=setTimeout(showSuggestions,280);});
$("gameInput").addEventListener("focus",()=>{if($("gameInput").value.trim())showSuggestions();});
document.addEventListener("click",e=>{if(!e.target.closest("#gameInput")&&!e.target.closest("#suggestions"))$("suggestions").style.display="none";});
$("filterInput").addEventListener("input",render);
$("suggestForm").addEventListener("submit",e=>{
  e.preventDefault();
  const game=$("gameInput").value.trim(), person=$("personInput").value.trim(), note=$("noteInput").value.trim();
  if(!game||!person)return;
  entries.push({game,person,note,createdAt:new Date().toISOString()});save();render();
  $("notice").textContent=game+" önerisi kaydedildi!";
  $("gameInput").value="";$("personInput").value="";$("noteInput").value="";chosen="";$("suggestions").style.display="none";
  setTimeout(()=>{$("notice").textContent="";},3000);
});
render();
</script>
</body>
</html>
